name: Rebuild compile check
on:
  push:
    branches: [ci-build-check]
jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: rookie-draft-production-v2
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - name: Audit legacy database syntax
        run: |
          if grep -R "@/lib/db" app lib --include='*.ts' --include='*.tsx' | grep -v '^lib/db.ts:'; then
            echo "Found active Neon imports"
            exit 1
          fi
          if grep -R "::jsonb\|nulls last" app lib --include='*.ts' --include='*.tsx' | grep -v '^lib/db.ts:'; then
            echo "Found PostgreSQL-only SQL syntax"
            exit 1
          fi
      - run: npm run build
