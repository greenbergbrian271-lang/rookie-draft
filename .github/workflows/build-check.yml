name: Rebuild compile check
on:
  push:
    branches: [ci-build-check]
jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: rookie-draft-production-v2
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - name: Diagnose ESPN player search
        run: |
          node - <<'NODE'
          const names=["Mark Fletcher Jr.","J'Koby Williams","Demond Williams Jr.","Ryan Wingo"];
          const norm=s=>String(s||"").toLowerCase().replace(/\b(jr|sr|ii|iii|iv)\b/g,"").replace(/[^a-z0-9]+/g," ").trim().replace(/\s+/g," ");
          for(const name of names){
            const u=new URL("https://site.web.api.espn.com/apis/search/v2");
            u.search=new URLSearchParams({query:name,sport:"football",limit:"10"}).toString();
            const r=await fetch(u),j=await r.json();
            const groups=Array.isArray(j?.items)?j.items:[];
            const pg=groups.find(g=>g?.type==="player");
            console.log("QUERY",name,"STATUS",r.status,"GROUPS",groups.map(g=>g?.type),"PLAYER_TOTAL",pg?.totalFound,"RAW_FIRST",JSON.stringify(pg?.contents?.[0]||null));
            const contents=Array.isArray(pg?.contents)?pg.contents:[];
            console.log("NORMALIZED",norm(name),contents.slice(0,5).map(x=>[x.displayName,norm(x.displayName),norm(x.displayName)===norm(name)]));
            await new Promise(r=>setTimeout(r,750));
          }
          NODE
      - run: npm run build
