name: Player stats schema probe
on:
  push:
    branches: [ci-build-check]
jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: rookie-draft-production-v2
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - name: Inspect ESPN stats schema
        run: |
          node - <<'NODE'
          const id="5141684";
          const url=`https://site.web.api.espn.com/apis/common/v3/sports/football/college-football/athletes/${id}/stats`;
          const r=await fetch(url,{headers:{"user-agent":"Mozilla/5.0"}});
          const j=await r.json();
          console.log("ROOT_KEYS",Object.keys(j));
          console.log("TEAM_KEYS",Object.keys(j.teams||{}));
          for(const c of j.categories||[]){
            console.log("\nCATEGORY",c.name,c.displayName);
            console.log("KEYS",Object.keys(c));
            console.log("LABELS",JSON.stringify(c.labels));
            console.log("NAMES",JSON.stringify(c.names));
            console.log("STATS_TYPE",Array.isArray(c.statistics),typeof c.statistics,"COUNT",c.statistics?.length);
            console.log("STAT_SAMPLE",JSON.stringify((c.statistics||[]).slice(0,4),null,2));
          }
          NODE
      - run: npm run build
