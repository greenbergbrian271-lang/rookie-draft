name: Team tab API probe
on:
  push:
    branches: [ci-build-check]
jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: rookie-draft-production-v2
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - name: Inspect Texas boxscore player schema
        run: |
          node - <<'NODE'
          const eventId="401856667",athleteId="4870906";
          const br=await fetch(`https://site.api.espn.com/apis/site/v2/sports/football/college-football/summary?event=${eventId}`);
          const bj=await br.json();
          console.log("SUMMARY_STATUS",br.status,"HEADER",JSON.stringify(bj.header?.competitions?.[0]?.competitors?.map(c=>({id:c.id,homeAway:c.homeAway,score:c.score,team:c.team?.displayName,abbr:c.team?.abbreviation,winner:c.winner})),null,2));
          const teams=bj.boxscore?.players||[];
          for(const t of teams){
            console.log("\nTEAM",t.team?.displayName,t.team?.id);
            for(const c of t.statistics||[]){
              const a=(c.athletes||[]).find(x=>String(x.athlete?.id)===athleteId);
              console.log("CATEGORY",c.name,"LABELS",JSON.stringify(c.labels),"FOUND",!!a,a?JSON.stringify({name:a.athlete?.displayName,stats:a.stats}):"");
            }
          }
          NODE
      - run: npm run build
