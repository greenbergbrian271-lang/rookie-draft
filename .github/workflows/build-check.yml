name: Rebuild compile check
on:
  push:
    branches: [ci-build-check]
jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: rookie-draft-production-v2
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - name: Probe ESPN search variants
        run: |
          node - <<'NODE'
          const name="Mark Fletcher Jr.";
          const urls=[
            "https://site.web.api.espn.com/apis/common/v3/search?"+new URLSearchParams({region:"us",lang:"en",query:name,limit:"10"}),
            "https://site.web.api.espn.com/apis/common/v3/search?"+new URLSearchParams({region:"us",lang:"en",query:"Mark Fletcher",limit:"10"}),
            "https://site.web.api.espn.com/apis/search/v2?"+new URLSearchParams({query:name,sport:"football",limit:"10"}),
            "https://site.web.api.espn.com/apis/search/v2?"+new URLSearchParams({query:"Mark Fletcher",sport:"football",limit:"10"})
          ];
          for (const url of urls) {
            const r=await fetch(url); const j=await r.json();
            console.log("\nURL",url,"STATUS",r.status,"COUNT",j.count);
            console.log(JSON.stringify((j.items||j.results||[]).slice(0,10),null,2));
          }
          NODE
      - run: npm run build
