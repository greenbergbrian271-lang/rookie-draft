name: Rebuild compile check
on:
  push:
    branches: [ci-build-check]
jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: rookie-draft-production-v2
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - name: Probe ESPN search schema
        run: |
          node - <<'NODE'
          const names=["J'Koby Williams","Mark Fletcher Jr.","Demond Williams Jr.","Ryan Wingo"];
          for (const name of names) {
            const u=new URL("https://site.web.api.espn.com/apis/common/v3/search");
            u.search=new URLSearchParams({region:"us",lang:"en",query:name,limit:"10",mode:"prefix"}).toString();
            const r=await fetch(u);
            const j=await r.json();
            console.log("\nNAME",name,"STATUS",r.status,"COUNT",j.count);
            console.log(JSON.stringify((j.items||[]).slice(0,5),null,2));
          }
          NODE
      - name: Audit legacy database syntax
        run: |
          if grep -R "@/lib/db" app lib --include='*.ts' --include='*.tsx' | grep -v '^lib/db.ts:'; then
            echo "Found active Neon imports"
            exit 1
          fi
          if grep -R "::jsonb\|nulls last" app lib --include='*.ts' --include='*.tsx' | grep -v '^lib/db.ts:'; then
            echo "Found PostgreSQL-only SQL syntax"
            exit 1
          fi
      - run: npm run build
