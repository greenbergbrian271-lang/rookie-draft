name: Rebuild compile check
on:
  push:
    branches: [ci-build-check]
jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: rookie-draft-production-v2
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - name: Probe ESPN athlete detail
        run: |
          node - <<'NODE'
          for (const id of ["4870736","5086393","5079653"]) {
            const url="https://site.web.api.espn.com/apis/common/v3/sports/football/college-football/athletes/"+id;
            const r=await fetch(url); const j=await r.json();
            console.log("\nID",id,"STATUS",r.status);
            console.log(JSON.stringify(j,null,2).slice(0,8000));
          }
          NODE
      - run: npm run build
