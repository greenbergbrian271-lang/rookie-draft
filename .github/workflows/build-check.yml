name: Player stats API probe
on:
  push:
    branches: [ci-build-check]
jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: rookie-draft-production-v2
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - name: Probe ESPN stats endpoints
        run: |
          node - <<'NODE'
          const id="5141684";
          const urls=[
            `https://site.web.api.espn.com/apis/common/v3/sports/football/college-football/athletes/${id}/stats`,
            `https://site.web.api.espn.com/apis/common/v3/sports/football/college-football/athletes/${id}`,
            `https://sports.api.espn.com/apis/v2/sports/football/college-football/leagues/college-football/seasons/2026/types/2/athletes/${id}/statistics`,
            `https://site.api.espn.com/apis/site/v2/sports/football/college-football/athletes/${id}`
          ];
          for(const url of urls){
            try{
              const r=await fetch(url,{headers:{"user-agent":"Mozilla/5.0"}});
              const txt=await r.text();
              console.log("\nURL",url,"STATUS",r.status,"CT",r.headers.get("content-type"));
              console.log(txt.slice(0,12000));
            }catch(e){console.log("ERR",url,e.message)}
          }
          NODE
      - run: npm run build
