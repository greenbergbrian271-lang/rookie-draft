name: RB Preview Typecheck
on:
  push:
    branches:
      - rb-scouting-workspace-v1-20260928
jobs:
  typecheck:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: rookie-draft-production-v2
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - run: npx tsc --noEmit --pretty false
